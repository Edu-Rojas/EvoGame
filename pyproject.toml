[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guerra-de-especies"
version = "0.1.0"
description = "Ecosistema evolutivo donde cada pana crea su especie y compiten en un mundo compartido"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
especies-headless = "especies.cli:main"
especies-acceptance = "especies.acceptance:main"

[project.optional-dependencies]
viewer = ["pygame-ce>=2.4"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
especies = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["slow: corridas largas de evolución (pytest -m 'not slow' para saltarlas)"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
# E/F: errores y nombres sin usar; I: orden de imports; B: bugs comunes;
# UP: sintaxis moderna; SIM: simplificaciones; NPY: malas prácticas de numpy;
# S: seguridad (bandit)
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "S"]
ignore = ["E741"]   # nombres como `l` en geometría

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]   # assert es la forma normal de testear con pytest

[tool.mypy]
python_version = "3.11"
files = ["src", "viewer"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "pygame.*"]
ignore_missing_imports = true
