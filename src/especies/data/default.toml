# =====================================================================
# Guerra de especies: TODOS los números de balance viven aquí.
# Cambia valores, re-corre la simulación y compara. No hace falta tocar código.
# Unidades: distancias en "unidades de mundo", tiempo en ticks.
# =====================================================================

[sim]
seed = 42             # -1 = semilla aleatoria (se imprime para poder repetirla)
capacity = 6000       # tope duro de criaturas vivas a la vez
think_interval = 3    # cada cuántos ticks decide cada criatura (en la v2 lo pondrá Percepción)
founder_spawn = "grouped"  # "grouped": cada especie nace en su zona (evitando el agua); "uniform": por todo el mapa
founder_spread = 80.0      # radio aproximado de la zona de cada especie

[world]
width = 1600.0
height = 1000.0       # el mundo es un toro: lo que sale por un borde entra por el opuesto

[terrain]
cell_size = 20.0            # tamaño de cada celda de terreno (el mapa queda de 80 x 50 celdas)
noise_scale = 5.0           # tamaño de las manchas de bioma, en celdas (más grande = zonas más grandes)
temperature_scale = 1.6     # el clima cambia más suave que el relieve: x noise_scale para la temperatura
# Fracción aproximada del mapa para cada bioma (el resto es pradera):
water_fraction = 0.06       # lagos chicos: no parten el mapa
mountain_fraction = 0.10
cold_fraction = 0.13
desert_fraction = 0.14
forest_fraction = 0.24
grass_per_cell = 30.0       # pasto máximo de una celda de pradera (los biomas lo multiplican)
min_to_target = 3.0         # una celda con menos pasto que esto no vale la pena
min_to_stay = 0.5           # si la celda objetivo baja de esto mientras va, se rinde y explora
food_distance_penalty = 1.0   # al elegir dónde comer: energía - esto x energía real del viaje
cold_size_exponent = 0.333  # regla de Bergmann: el frío cuesta / tamaño^(1/3)

# Cada bioma: rebrote por tick, pasto máximo (x grass_per_cell), hojas altas máximas
# (x [leaves] per_cell) y su rebrote, velocidad, visibilidad (x radio de detección),
# costo (x gasto de energía) y colores.
[biomes.pradera]
regrow = 0.04
max_grass = 1.0
max_leaves = 0.0
leaf_regrow = 0.0
speed = 1.0
visibility = 1.0
cost = 1.0
color_lush = [96, 150, 70]
color_bare = [150, 140, 92]

[biomes.bosque]
regrow = 0.06
max_grass = 1.5
max_leaves = 1.0            # solo el bosque tiene hojas altas: el nicho de los grandes
leaf_regrow = 0.05
speed = 0.7
visibility = 0.6
cost = 1.0
color_lush = [40, 95, 52]
color_bare = [78, 86, 56]

[biomes.desierto]
regrow = 0.006
max_grass = 0.3
max_leaves = 0.0
leaf_regrow = 0.0
speed = 1.1
visibility = 1.3
cost = 1.15
color_lush = [214, 192, 128]
color_bare = [198, 172, 112]

[biomes.montana]
regrow = 0.015
max_grass = 0.5
max_leaves = 0.0
leaf_regrow = 0.0
speed = 0.6
visibility = 1.25
cost = 1.3
color_lush = [126, 124, 118]
color_bare = [104, 101, 97]

[biomes.helada]
regrow = 0.01
max_grass = 0.4
max_leaves = 0.0
leaf_regrow = 0.0
speed = 0.8
visibility = 1.0
cost = 1.6                  # el frío: los grandes pagan menos (Bergmann)
color_lush = [220, 230, 238]
color_bare = [188, 198, 210]

[biomes.agua]
regrow = 0.0
max_grass = 0.0
max_leaves = 0.0
leaf_regrow = 0.0
speed = 0.35                # se cruza nadando, lento
visibility = 1.0
cost = 1.4
color_lush = [52, 98, 150]
color_bare = [52, 98, 150]

[genes]
budget = 20           # puntos repartibles al crear la especie (todos los genes arrancan en 1)
mutation_sigma = 0.3  # ruido de la mutación por gen y por nacimiento
inactive = ["camuflaje"]  # todavía no hace nada, así que no muta (se activa en la 1c)

[body]
base_radius = 4.0          # radio (de choque y visual) con tamaño 1; crece con la raíz del tamaño
reserve_per_size = 60.0    # reserva máxima de energía = esto x tamaño
appetite_base = 0.05       # gasto basal por tick con tamaño 1
kleiber_exponent = 0.75    # gasto basal proporcional a tamaño^0,75
base_lifespan = 1800       # vida en ticks (a 10 ticks/s son 3 minutos)
aging_extra_at_max = 0.6   # tamaño 10 envejece 1,6 veces más rápido
aging_curve = 1.5          # forma de esa curva: extra x tamaño_normalizado^esto (>1 = solo pesa en los muy grandes)
senescence_start = 0.7     # desde qué fracción de la vida empieza el deterioro
old_age_speed = 0.5        # al final de la vida se mueve a esta fracción de su velocidad máxima
founder_energy = 0.5       # fracción de la reserva con la que arrancan los fundadores
founder_max_age = 0.3      # los fundadores arrancan con edades al azar hasta esta fracción de la vida
bite = 4.0                 # energía de pasto que come por tick

[movement]
base_speed = 2.0           # velocidad máxima con aceleración 1
accel_speed_bonus = 1.0    # aceleración 10 = +100% de velocidad máxima
steering = 0.25            # qué tan rápido corrige hacia la dirección deseada (0..1)
cruise_fraction = 0.5      # al explorar va a esta fracción de su velocidad máxima
wander_turn = 0.35         # ruido de giro al explorar (radianes por tick)
move_cost = 0.03           # gasto extra por moverse, escala con tamaño^0,75 y (velocidad/base)^2
veil_drag = 0.1            # apareamiento 10 = 10% más lento (las plumas largas frenan)
contact_distance = 2.0     # distancia extra al radio para comer o aparearse
separation_strength = 0.8  # qué tan fuerte se empujan dos cuerpos que se pisan (0 = se atraviesan)
body_footprint = 1.5       # radio de "espacio personal" = radio x esto (el cuerpo es largo)
home_range = 150.0         # filopatría: al explorar, más allá de esta distancia de donde nació...
home_pull = 0.5            # ...lo atrae su "casa" con esta fuerza (0 = apagado, 1 = vuelve directo)
cover_seek = 1.5           # al huir, cuánto tuerce hacia la cobertura cercana (0 = huye derecho)

[detection]
base_radius = 40.0
max_multiplier = 3.0         # detección 10 = 3 veces el radio base
appetite_extra_at_max = 0.25 # detección 10 = +25% de gasto basal
appetite_curve = 2.0         # forma de ese costo: 2 = proporcional al área que cubre la vista

[diet]
exponent = 1.5   # >1 castiga a los omnívoros, <1 los favorece, 1 es neutro

[reproduction]
maturity_fraction = 0.15     # fracción de la vida para ser adulto
ready_energy_fraction = 0.6  # energía mínima (fracción de la reserva) para aparearse
contribution = 0.3           # fracción de su energía que aporta cada padre a la camada
max_litter = 4
cooldown = 80                # ticks de espera entre apareamientos (igual para todos)
spawn_spread = 6.0           # qué tan lejos de los padres aparecen las crías

[leaves]
per_cell = 30.0              # hojas altas máximas de una celda (los biomas lo multiplican)
reach_min_size = 4.0         # con tamaño menor a esto no alcanza las hojas
reach_full_size = 8.0        # desde este tamaño las alcanza todas (lineal en el medio)

[combat]
health_per_size = 10.0       # vida máxima = esto x tamaño
health_regen = 0.002         # fracción de la vida máxima que se recupera por tick
bite_base = 2.0              # daño por mordida con tamaño 1
bite_size_exponent = 0.75    # daño = base x tamaño^esto x armas
weapons_herbivore = 0.6      # multiplicador de daño con dieta 1 (sin colmillos)
weapons_carnivore = 1.4      # con dieta 10 (colmillos)
bite_energy_cost = 0.3       # energía que gasta el atacante por mordida
retaliation = 0.5            # daño devuelto = su daño x agresividad normalizada x esto
max_prey_ratio = 1.3         # solo caza presas de tamaño <= el suyo x esto (refugio por tamaño)
predator_meat_eff = 0.2      # desde esta eficiencia con carne alguien caza y es una amenaza
idle_threat = 0.3            # un depredador que no está cazando asusta esto (1 = igual que cazando)
aggression_factor_min = 0.5  # agresividad 1: huye de amenazas de la mitad de su poder
aggression_factor_max = 2.0  # agresividad 10: enfrenta amenazas de hasta el doble
chase_ticks = 60             # persecución base antes de rendirse
chase_min_mult = 0.5         # agresividad 1 persigue la mitad...
chase_max_mult = 1.5         # ...y agresividad 10, una vez y media
satiety_fraction = 0.8       # no caza con la energía por encima de esta fracción (Holling II)
prey_search_half = 2.0       # imagen de búsqueda (Holling III): cazar vale x presas/(presas + esto)
                             # según cuántas presas ve; 0 = apagado
newborn_health_energy = 40.0 # energía de la cría que le da vida completa al nacer
newborn_health_min = 0.3     # vida mínima al nacer (fracción de la máxima)

[meat]
per_size = 5.0               # carne que deja un cadáver por punto de tamaño. Ojo: el cuerpo no
                             # se "paga" con energía, así que esto no puede ser alto: con 15 una
                             # cría de conejo dejaba más carne que la energía que costó criarla
                             # (energía gratis para los depredadores; Lindeman dice ~10-20%)
energy_fraction = 0.25       # más esta fracción de la energía que tenía (con 0,5 los cadáveres
                             # de los grandes mantenían a los depredadores sin cazar)
rot = 0.002                  # fracción que se pudre por tick
min_amount = 0.5             # debajo de esto la carne desaparece

[disease]
# Contagio por densidad ("kill the winner"): apiñarse con los de tu especie cuesta energía.
radius = 30.0                # vecinos de su especie dentro de este radio
free_neighbors = 3           # hasta esta cantidad no pasa nada (grupos chicos, sanos)
cost_per_neighbor = 0.15     # gasto extra por vecino de más, como fracción del apetito (0 = apagado).
                             # Sola no ayudaba; junto con la carne coherente frena a los
                             # depredadores que se apiñan en los cadáveres

[behavior]
decision_noise = 0.08
explore_base = 0.3     # utilidad base de explorar
eat_base = 0.15        # utilidad de comer aunque no tenga hambre
mate_base = 1.0        # utilidad de aparearse cuando está lista y ve pareja
hunt_base = 1.5        # utilidad de cazar = esto x hambre x eficiencia con carne
flee_base = 2.0        # utilidad de huir = esto x nivel de amenaza (0..1)
instinct_sigma = 0.05  # mutación de los instintos heredables
instinct_min = 0.2
instinct_max = 3.0

[stats]
generation_bonus = 0     # +tope de stats por generación (apagado, v2)

# ---------------------------------------------------------------------
# Especies de ejemplo. Genes de 1 a 10; puntos gastados = suma de (gen - 1).
# Camuflaje todavía no hace nada: se hereda pero no muta ([genes] inactive).
# ---------------------------------------------------------------------
[[species]]
name = "Conejos"
color = [120, 220, 140]
count = 80
genes = { tamano = 2, aceleracion = 4, agresividad = 1, dieta = 1, camuflaje = 1, deteccion = 4, apareamiento = 9 }

[[species]]
name = "Elefantes"
color = [120, 170, 255]
count = 50
genes = { tamano = 9, aceleracion = 2, agresividad = 8, dieta = 1, camuflaje = 1, deteccion = 5, apareamiento = 1 }

[[species]]
name = "Ojones"
color = [255, 170, 90]
count = 60
genes = { tamano = 4, aceleracion = 3, agresividad = 1, dieta = 1, camuflaje = 1, deteccion = 9, apareamiento = 3 }

[[species]]
name = "Lobos"
color = [230, 90, 110]
count = 30
genes = { tamano = 4, aceleracion = 5, agresividad = 4, dieta = 9, camuflaje = 1, deteccion = 2, apareamiento = 2 }
